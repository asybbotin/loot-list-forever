name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Regression tests (${{ matrix.runtime }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runtime: [luajit, lua5.1]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Lua runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes ${{ matrix.runtime }}

      - name: Run regression tests
        run: ${{ matrix.runtime }} tests/run.lua
